[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thwaites-icesat2"
version = "0.2.0"
description = "Altimetria laser ICESat-2 (ATL06) para balanço de massa e derretimento basal no Mar de Amundsen e Geleira Thwaites (2019–2025)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Jota", email = "231028559@aluno.unb.br" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "earthaccess>=0.11",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "xarray>=2024.0",
    "netCDF4>=1.6",
    "zarr>=2.16",
    "dask>=2024.0",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
analysis = [
    "pytmd>=3.0",
    "pymannkendall>=1.4",
    "pykrige>=1.7",
    "scikit-gstat>=1.0",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbclient>=0.9",
]

[tool.setuptools.packages.find]
include = ["thwaites*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
